name: Production Check
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
permissions:
  contents: read
concurrency:
  group: production-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed app
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://healthassessmenthub.com' }}
        run: node scripts/verify-deployment.js
